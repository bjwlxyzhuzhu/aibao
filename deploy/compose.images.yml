# Pull images built by GitHub Actions; no build tools are needed on the server.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aibao
      POSTGRES_USER: aibao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibao -d aibao"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: ghcr.io/bjwlxyzhuzhu/aibao-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://aibao:${DB_PASSWORD}@db:5432/aibao
      ASR_URL: http://asr:9000
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes: ["appdata:/data"]
    depends_on:
      db:
        condition: service_healthy
  asr:
    image: ghcr.io/bjwlxyzhuzhu/aibao-asr:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASR_MODEL: ${ASR_MODEL:-iic/SenseVoiceSmall}
    volumes: ["asrmodels:/models"]
  web:
    image: ghcr.io/bjwlxyzhuzhu/aibao-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"]
    depends_on: [api]
volumes:
  pgdata: {}
  appdata: {}
  asrmodels: {}
