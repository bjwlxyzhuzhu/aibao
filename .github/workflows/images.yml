name: Build and publish container images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Check frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
        working-directory: web
      - run: npm run build
        working-directory: web

  images:
    name: Build ${{ matrix.service }} image
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, asr]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
      - name: Build and load for verification
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Verify container before publishing
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          if [ "$SERVICE" = api ]; then
            docker run --rm --network none \
              -e DATA_DIR=/tmp/aibao-ci \
              -e DATABASE_URL=sqlite:////tmp/aibao-ci.db \
              -e DEMO_MODE=false -e SEED_DEMO=false -e LLM_API_KEY= \
              -e DEMO_PASSWORD=ci-only-disposable-bootstrap-password \
              -e JWT_SECRET=ci-only-disposable-signing-secret \
              -v "$PWD/.github/scripts:/ci:ro" \
              --entrypoint python "$image" /ci/smoke.py api
          elif [ "$SERVICE" = asr ]; then
            docker run --rm --network none \
              -v "$PWD/.github/scripts:/ci:ro" \
              --entrypoint python "$image" /ci/smoke.py asr
          else
            docker run --rm --entrypoint sh "$image" -ec \
              'test -s /usr/share/nginx/html/index.html'
            # Nginx resolves the api upstream at startup; add a disposable resolver entry for config validation.
            docker run --rm --add-host api:127.0.0.1 --entrypoint nginx "$image" -t
          fi
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [ -z "$image" ] || docker push "$image"
          done <<< "$IMAGE_TAGS"
          {
            echo '### Published images'
            printf '%s\n' "$IMAGE_TAGS" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
